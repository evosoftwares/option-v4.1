<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460">
  <defs>
    <style>
      .box{fill:#ffffff;stroke:#1f2937;stroke-width:2;rx:8;ry:8}
      .title{font-family:Arial, Helvetica, sans-serif;font-weight:bold;font-size:16px;fill:#111827}
      .text{font-family:Arial, Helvetica, sans-serif;font-size:13px;fill:#374151}
      .arrow{stroke:#1f2937;stroke-width:2;marker-end:url(#arrow)}
      .groupTitle{font-family:Arial, Helvetica, sans-serif;font-weight:bold;font-size:18px;fill:#0f766e}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937" />
    </marker>
  </defs>

  <text x="20" y="30" class="groupTitle">Fluxo de Notificações (Eventos → Push → Histórico)</text>

  <rect x="30" y="70" width="220" height="80" class="box"/>
  <text x="40" y="95" class="title">Eventos do Sistema</text>
  <text x="40" y="115" class="text">Trips, Pagamentos, Alertas</text>

  <line x1="250" y1="110" x2="310" y2="110" class="arrow"/>

  <rect x="310" y="70" width="230" height="80" class="box"/>
  <text x="320" y="95" class="title">NotificationService</text>
  <text x="320" y="115" class="text">Cria registro em notifications</text>

  <line x1="425" y1="150" x2="425" y2="210" class="arrow"/>

  <rect x="310" y="210" width="230" height="80" class="box"/>
  <text x="320" y="235" class="title">OneSignalService</text>
  <text x="320" y="255" class="text">Envia push (segmento/usuário)</text>

  <line x1="540" y1="250" x2="640" y2="250" class="arrow"/>

  <rect x="640" y="210" width="240" height="80" class="box"/>
  <text x="650" y="235" class="title">Dispositivo do Usuário</text>
  <text x="650" y="255" class="text">Recebe e exibe push</text>

  <line x1="425" y1="290" x2="425" y2="350" class="arrow"/>

  <rect x="310" y="350" width="230" height="70" class="box"/>
  <text x="320" y="375" class="title">NotificationHistory</text>
  <text x="320" y="395" class="text">Analytics, status de entrega</text>

  <rect x="700" y="70" width="250" height="130" class="box"/>
  <text x="710" y="95" class="title">Agendamentos/Recorrências</text>
  <text x="710" y="115" class="text">NotificationSchedulerService</text>
  <text x="710" y="135" class="text">Rotinas de envio programado</text>
</svg>