<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
  <defs>
    <style>
      .box{fill:#ffffff;stroke:#1f2937;stroke-width:2;rx:8;ry:8}
      .title{font-family:Arial, Helvetica, sans-serif;font-weight:bold;font-size:16px;fill:#111827}
      .text{font-family:Arial, Helvetica, sans-serif;font-size:13px;fill:#374151}
      .arrow{stroke:#1f2937;stroke-width:2;marker-end:url(#arrow)}
      .groupTitle{font-family:Arial, Helvetica, sans-serif;font-weight:bold;font-size:18px;fill:#0f766e}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937" />
    </marker>
  </defs>

  <text x="20" y="30" class="groupTitle">Fluxo de Corrida (Passageiro ↔ Motorista)</text>

  <!-- Linha 1 -->
  <rect x="20" y="60" width="200" height="80" class="box"/>
  <text x="30" y="85" class="title">Passageiro</text>
  <text x="30" y="105" class="text">Define origem/destino</text>
  <text x="30" y="122" class="text">Confirma solicitação</text>

  <line x1="220" y1="100" x2="280" y2="100" class="arrow"/>

  <rect x="280" y="60" width="220" height="80" class="box"/>
  <text x="290" y="85" class="title">TripRequestManager</text>
  <text x="290" y="105" class="text">Cria trip_request</text>
  <text x="290" y="122" class="text">Notifica motoristas elegíveis</text>

  <line x1="500" y1="100" x2="560" y2="100" class="arrow"/>

  <rect x="560" y="60" width="200" height="80" class="box"/>
  <text x="570" y="85" class="title">OneSignal</text>
  <text x="570" y="105" class="text">Push de nova corrida</text>

  <line x1="660" y1="140" x2="660" y2="200" class="arrow"/>

  <rect x="560" y="200" width="200" height="80" class="box"/>
  <text x="570" y="225" class="title">Motorista</text>
  <text x="570" y="245" class="text">Aceita corrida no app</text>

  <line x1="560" y1="240" x2="500" y2="240" class="arrow"/>

  <rect x="280" y="200" width="220" height="80" class="box"/>
  <text x="290" y="225" class="title">TripService</text>
  <text x="290" y="245" class="text">Cria trip e atribui motorista</text>

  <line x1="390" y1="280" x2="390" y2="340" class="arrow"/>

  <rect x="260" y="340" width="260" height="80" class="box"/>
  <text x="270" y="365" class="title">Execução da Corrida</text>
  <text x="270" y="385" class="text">Iniciar → Em andamento → Finalizar</text>

  <line x1="390" y1="420" x2="390" y2="470" class="arrow"/>

  <rect x="240" y="470" width="300" height="40" class="box"/>
  <text x="250" y="495" class="title">TripPaymentService → Processar pagamento</text>

  <!-- Legenda lateral -->
  <rect x="800" y="60" width="180" height="270" class="box"/>
  <text x="810" y="85" class="title">Serviços/Componentes</text>
  <text x="810" y="110" class="text">- TripRequestManager</text>
  <text x="810" y="130" class="text">- OneSignal</text>
  <text x="810" y="150" class="text">- TripService</text>
  <text x="810" y="170" class="text">- DriverAvailability</text>
  <text x="810" y="190" class="text">- TripPaymentService</text>
  <text x="810" y="210" class="text">- PaymentProcessor</text>
  <text x="810" y="230" class="text">- AsaasService</text>
  <text x="810" y="250" class="text">- NotificationService</text>
</svg>