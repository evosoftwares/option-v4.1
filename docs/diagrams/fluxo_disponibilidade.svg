<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480">
  <defs>
    <style>
      .box{fill:#ffffff;stroke:#1f2937;stroke-width:2;rx:8;ry:8}
      .title{font-family:Arial, Helvetica, sans-serif;font-weight:bold;font-size:16px;fill:#111827}
      .text{font-family:Arial, Helvetica, sans-serif;font-size:13px;fill:#374151}
      .arrow{stroke:#1f2937;stroke-width:2;marker-end:url(#arrow)}
      .groupTitle{font-family:Arial, Helvetica, sans-serif;font-weight:bold;font-size:18px;fill:#0f766e}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937" />
    </marker>
  </defs>

  <text x="20" y="30" class="groupTitle">Disponibilidade de Motoristas (Realtime)</text>

  <rect x="30" y="70" width="240" height="80" class="box"/>
  <text x="40" y="95" class="title">Driver App</text>
  <text x="40" y="115" class="text">Fica online/offline</text>

  <line x1="270" y1="110" x2="330" y2="110" class="arrow"/>

  <rect x="330" y="70" width="280" height="80" class="box"/>
  <text x="340" y="95" class="title">DriverService</text>
  <text x="340" y="115" class="text">Atualiza status/posição</text>

  <line x1="470" y1="150" x2="470" y2="210" class="arrow"/>

  <rect x="330" y="210" width="280" height="80" class="box"/>
  <text x="340" y="235" class="title">Supabase (drivers)</text>
  <text x="340" y="255" class="text">Persiste status/coords</text>

  <line x1="610" y1="250" x2="700" y2="250" class="arrow"/>

  <rect x="700" y="210" width="260" height="80" class="box"/>
  <text x="710" y="235" class="title">DriverAvailabilityService</text>
  <text x="710" y="255" class="text">Stream .from('drivers').stream()</text>

  <line x1="830" y1="210" x2="830" y2="150" class="arrow"/>

  <rect x="720" y="70" width="220" height="80" class="box"/>
  <text x="730" y="95" class="title">Passenger UI</text>
  <text x="730" y="115" class="text">Acompanha disponibilidade</text>
</svg>