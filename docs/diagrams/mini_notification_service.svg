<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <defs>
    <style>
      .box{fill:#ffffff;stroke:#1f2937;stroke-width:2;rx:8;ry:8}
      .title{font-family:Arial, Helvetica, sans-serif;font-weight:bold;font-size:16px;fill:#111827}
      .text{font-family:Arial, Helvetica, sans-serif;font-size:13px;fill:#374151}
      .arrow{stroke:#1f2937;stroke-width:2;marker-end:url(#arrow)}
      .groupTitle{font-family:Arial, Helvetica, sans-serif;font-weight:bold;font-size:18px;fill:#0f766e}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937" />
    </marker>
  </defs>

  <text x="20" y="30" class="groupTitle">Mini - NotificationService (Componentes e Fluxo)</text>

  <rect x="40" y="70" width="260" height="80" class="box"/>
  <text x="50" y="95" class="title">NotificationService</text>
  <text x="50" y="115" class="text">CRUD + Orquestração</text>

  <line x1="300" y1="110" x2="380" y2="110" class="arrow"/>

  <rect x="380" y="70" width="240" height="80" class="box"/>
  <text x="390" y="95" class="title">OneSignalService</text>
  <text x="390" y="115" class="text">Envio Push/Segmentos</text>

  <line x1="170" y1="150" x2="170" y2="210" class="arrow"/>
  
  <rect x="40" y="210" width="260" height="80" class="box"/>
  <text x="50" y="235" class="title">NotificationScheduler</text>
  <text x="50" y="255" class="text">Agend./Recorrência</text>

  <line x1="500" y1="150" x2="500" y2="210" class="arrow"/>
  
  <rect x="380" y="210" width="240" height="80" class="box"/>
  <text x="390" y="235" class="title">NotificationHistory</text>
  <text x="390" y="255" class="text">Registro/Analytics</text>

  <line x1="620" y1="250" x2="720" y2="250" class="arrow"/>

  <rect x="720" y="210" width="240" height="80" class="box"/>
  <text x="730" y="235" class="title">Supabase</text>
  <text x="730" y="255" class="text">Tabela notifications</text>

  <line x1="620" y1="110" x2="720" y2="110" class="arrow"/>

  <rect x="720" y="70" width="240" height="80" class="box"/>
  <text x="730" y="95" class="title">UI Notificações</text>
  <text x="730" y="115" class="text">Stream por usuário</text>
</svg>