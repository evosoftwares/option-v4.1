<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
  <defs>
    <style>
      .box{fill:#ffffff;stroke:#1f2937;stroke-width:2;rx:8;ry:8}
      .title{font-family:Arial, Helvetica, sans-serif;font-weight:bold;font-size:16px;fill:#111827}
      .text{font-family:Arial, Helvetica, sans-serif;font-size:13px;fill:#374151}
      .arrow{stroke:#1f2937;stroke-width:2;marker-end:url(#arrow)}
      .groupTitle{font-family:Arial, Helvetica, sans-serif;font-weight:bold;font-size:18px;fill:#0f766e}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937" />
    </marker>
  </defs>

  <text x="20" y="30" class="groupTitle">Fluxo de Pagamentos (Cobrança → Repasse → Carteira)</text>

  <rect x="40" y="70" width="250" height="80" class="box"/>
  <text x="50" y="95" class="title">TripPaymentService</text>
  <text x="50" y="115" class="text">Ao finalizar corrida</text>

  <line x1="290" y1="110" x2="350" y2="110" class="arrow"/>

  <rect x="350" y="70" width="260" height="80" class="box"/>
  <text x="360" y="95" class="title">PaymentProcessorService</text>
  <text x="360" y="115" class="text">Regras de comissão/saldos</text>

  <line x1="480" y1="150" x2="480" y2="210" class="arrow"/>

  <rect x="350" y="210" width="260" height="80" class="box"/>
  <text x="360" y="235" class="title">AsaasService (Gateway)</text>
  <text x="360" y="255" class="text">Cobrança do passageiro</text>

  <line x1="480" y1="290" x2="480" y2="350" class="arrow"/>

  <rect x="330" y="350" width="300" height="80" class="box"/>
  <text x="340" y="375" class="title">Transações / Saldos</text>
  <text x="340" y="395" class="text">Debit passenger, credit driver</text>

  <line x1="480" y1="430" x2="480" y2="490" class="arrow"/>

  <rect x="340" y="490" width="280" height="30" class="box"/>
  <text x="350" y="512" class="title">Withdrawals (saques do motorista)</text>

  <!-- Coluna direita: métodos -->
  <rect x="700" y="70" width="260" height="170" class="box"/>
  <text x="710" y="95" class="title">PaymentService</text>
  <text x="710" y="115" class="text">CRUD de payment_methods</text>
  <text x="710" y="135" class="text">Validação/seleção do método</text>

  <rect x="700" y="270" width="260" height="120" class="box"/>
  <text x="710" y="295" class="title">TransactionService</text>
  <text x="710" y="315" class="text">Registra wallet_transactions</text>
</svg>