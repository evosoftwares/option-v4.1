<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460">
  <defs>
    <style>
      .box{fill:#ffffff;stroke:#1f2937;stroke-width:2;rx:8;ry:8}
      .title{font-family:Arial, Helvetica, sans-serif;font-weight:bold;font-size:16px;fill:#111827}
      .text{font-family:Arial, Helvetica, sans-serif;font-size:13px;fill:#374151}
      .arrow{stroke:#1f2937;stroke-width:2;marker-end:url(#arrow)}
      .groupTitle{font-family:Arial, Helvetica, sans-serif;font-weight:bold;font-size:18px;fill:#0f766e}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937" />
    </marker>
  </defs>

  <text x="20" y="30" class="groupTitle">Fluxo de Emergência</text>

  <rect x="40" y="70" width="240" height="80" class="box"/>
  <text x="50" y="95" class="title">Usuário</text>
  <text x="50" y="115" class="text">Aciona SOS no app</text>

  <line x1="280" y1="110" x2="340" y2="110" class="arrow"/>

  <rect x="340" y="70" width="280" height="80" class="box"/>
  <text x="350" y="95" class="title">EmergencyService</text>
  <text x="350" y="115" class="text">Coleta localização + cria registro</text>

  <line x1="480" y1="150" x2="480" y2="210" class="arrow"/>

  <rect x="340" y="210" width="280" height="80" class="box"/>
  <text x="350" y="235" class="title">Supabase</text>
  <text x="350" y="255" class="text">Persistência + logs</text>

  <line x1="620" y1="250" x2="700" y2="250" class="arrow"/>

  <rect x="700" y="210" width="260" height="80" class="box"/>
  <text x="710" y="235" class="title">NotificationService</text>
  <text x="710" y="255" class="text">Envio a canais/suporte</text>

  <line x1="830" y1="210" x2="830" y2="150" class="arrow"/>

  <rect x="720" y="70" width="220" height="80" class="box"/>
  <text x="730" y="95" class="title">Canais de Resposta</text>
  <text x="730" y="115" class="text">Equipe interna / Terceiros</text>
</svg>