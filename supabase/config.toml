# Supabase CLI configuration

# API settings
[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public", "pgmq_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

# Database settings
[db]
port = 54322
shadow_port = 54320
major_version = 15

# Studio settings
[studio]
enabled = true
port = 54323

# Auth settings
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://698006c0-c590-4e07-8192-f899dbfcf4fb.lovableproject.com/**", "https://id-preview--698006c0-c590-4e07-8192-f899dbfcf4fb.lovable.app/**", "https://preview--ride-choice-express.lovable.app/**", "https://ride-choice-express.lovable.app/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1m0s"
otp_length = 6
otp_expiry = 86400

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Functions settings
[functions]

# Analytics settings
[analytics]
enabled = false
port = 54327
vector_port = 54328

# Realtime settings
[realtime]
enabled = true

# Storage settings
[storage]
enabled = true
file_size_limit = "50MiB"

# Inbucket settings
[inbucket]
enabled = true
port = 54324

# Edge Functions settings
[functions.hello]
verify_jwt = true